services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: nexus_ai
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_local_password
    ports:
      - "5432:5432"
    volumes:
      - nexus-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_ai"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.11
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - nexus-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: nexus-minio
      GARAGE_DEFAULT_SECRET_KEY: nexus-minio-local-secret
      GARAGE_DEFAULT_BUCKET: nexus-private
      GARAGE_RPC_SECRET: 4e4558555341494c4f43414c4741524147454e4558555341494c4f43414c4741
    ports:
      - "9000:3900"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - nexus-garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  nexus-postgres-data:
  nexus-redis-data:
  nexus-garage-data:
  # Retained intentionally: Garage cannot read MinIO's on-disk format, and this migration
  # must not delete or overwrite an existing developer's MinIO objects.
  nexus-minio-data:
